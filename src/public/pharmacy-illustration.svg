<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Lightish Pink Ambient Background Gradient (Matching Dashboard Theme) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f9"/>
      <stop offset="45%" stop-color="#ffebef"/>
      <stop offset="100%" stop-color="#fce2e8"/>
    </linearGradient>

    <!-- Counter Front Gradient (Soft Coral / Peach / Rose Pink matching Dashboard Expiry Radar) -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff0f3"/>
      <stop offset="60%" stop-color="#ffb6c1"/>
      <stop offset="100%" stop-color="#ff6b7e"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b2e"/>
      <stop offset="100%" stop-color="#190e1b"/>
    </linearGradient>

    <!-- Lower Counter Wave Fluid Gradient (Coral Pink to Soft Lilac) -->
    <linearGradient id="waveFluidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b7e"/>
      <stop offset="50%" stop-color="#ff8b94"/>
      <stop offset="100%" stop-color="#b8a9ff"/>
    </linearGradient>

    <linearGradient id="waveFluidDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="60%" stop-color="#ff6b7e"/>
      <stop offset="100%" stop-color="#9a74ff"/>
    </linearGradient>

    <!-- Wave Shadow Filter with Warm Rose Tint -->
    <filter id="waveShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="0" stdDeviation="8" flood-color="#be185d" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Background Scene Canvas -->
  <rect width="540" height="480" fill="url(#bgGrad)"/>

  <!-- 2. Pharmacy Back Wall Shelves & Warm Pastel Medicine Inventory -->
  <g opacity="0.9">
    <!-- Top Shelf Structure -->
    <rect x="180" y="70" width="360" height="6" fill="#fbcfe8" rx="3"/>
    <rect x="230" y="40" width="4" height="30" fill="#fce7f3"/>
    <rect x="340" y="40" width="4" height="30" fill="#fce7f3"/>
    <rect x="450" y="40" width="4" height="30" fill="#fce7f3"/>

    <!-- Middle Shelf Structure -->
    <rect x="180" y="150" width="360" height="6" fill="#fbcfe8" rx="3"/>
    <rect x="280" y="76" width="4" height="74" fill="#fce7f3"/>
    <rect x="400" y="76" width="4" height="74" fill="#fce7f3"/>

    <!-- Lower Shelf Structure -->
    <rect x="180" y="230" width="360" height="6" fill="#fbcfe8" rx="3"/>
    <rect x="250" y="156" width="4" height="74" fill="#fce7f3"/>
    <rect x="360" y="156" width="4" height="74" fill="#fce7f3"/>
    <rect x="480" y="156" width="4" height="74" fill="#fce7f3"/>

    <!-- Medicine Boxes & Jars on Upper Shelf (Pastel Coral, Rose & Peach) -->
    <!-- Large Archive Medical Box -->
    <rect x="240" y="92" width="44" height="58" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="248" y="102" width="28" height="20" rx="2" fill="#ffe4e6"/>
    <line x1="252" y1="130" x2="272" y2="130" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>

    <!-- Second Storage Box with Vibrant Coral Accent -->
    <rect x="290" y="100" width="40" height="50" rx="3" fill="#ff6b7e"/>
    <rect x="296" y="112" width="28" height="12" rx="2" fill="#ffffff"/>
    <line x1="296" y1="132" x2="318" y2="132" stroke="#ffe4e6" stroke-width="2"/>

    <!-- Pill Bottles / Jars -->
    <rect x="345" y="110" width="22" height="40" rx="3" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
    <rect x="348" y="105" width="16" height="5" rx="1.5" fill="#ffa185"/>
    <rect x="349" y="122" width="14" height="16" fill="#fff1f2"/>

    <!-- Files / Document Folders (Warm Pink to Peach & Lilac) -->
    <path d="M410,150 L410,105 L428,105 L428,150 Z" fill="#fda4af"/>
    <path d="M430,150 L430,100 L448,100 L448,150 Z" fill="#ff8b94"/>
    <path d="M450,150 L450,108 L468,108 L468,150 Z" fill="#fbcfe8"/>
    <path d="M470,150 L470,102 L488,102 L488,150 Z" fill="#b8a9ff"/>

    <!-- Medicine Cartons on Lower Shelf -->
    <rect x="195" y="185" width="48" height="45" rx="3" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
    <rect x="202" y="196" width="34" height="10" rx="2" fill="#ffa185"/>
    <line x1="202" y1="214" x2="228" y2="214" stroke="#fbcfe8" stroke-width="2"/>

    <rect x="260" y="175" width="38" height="55" rx="3" fill="#ffe4e6"/>
    <rect x="265" y="188" width="28" height="14" fill="#ffffff" rx="2"/>

    <rect x="380" y="190" width="55" height="40" rx="3" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
    <rect x="388" y="198" width="39" height="12" rx="2" fill="#ff758c"/>
    <line x1="388" y1="218" x2="415" y2="218" stroke="#fca5a5" stroke-width="2"/>

    <rect x="445" y="180" width="32" height="50" rx="3" fill="#ff6b7e"/>
    <circle cx="461" cy="205" r="7" fill="#ffffff"/>
  </g>

  <!-- 3. Female Pharmacist (Behind Counter, Right Side, Rose-Themed) -->
  <g id="pharmacist">
    <!-- Back Hair Silhouette -->
    <path d="M375,180 C365,130 380,95 410,90 C445,85 465,115 465,160 C465,195 455,230 450,240 C440,240 435,220 430,205 Z" fill="url(#hairGrad)"/>

    <!-- Neck & Shoulders -->
    <path d="M400,165 L420,165 L424,195 L396,195 Z" fill="#fed7aa"/>

    <!-- Face -->
    <ellipse cx="412" cy="142" rx="20" ry="24" fill="#fed7aa"/>

    <!-- Front Hair Bangs -->
    <path d="M392,135 C395,115 412,100 428,105 C438,108 442,120 440,135 C435,122 422,118 412,120 C402,122 396,128 392,135 Z" fill="url(#hairGrad)"/>
    <path d="M392,130 C388,145 388,165 392,185 C394,185 396,170 398,155 Z" fill="url(#hairGrad)"/>

    <!-- Facial Features: Smiling Eyes & Cheerful Smile -->
    <ellipse cx="406" cy="140" rx="2" ry="2.5" fill="#1e293b"/>
    <ellipse cx="420" cy="140" rx="2" ry="2.5" fill="#1e293b"/>
    <path d="M403,134 Q407,132 410,134" stroke="#1e293b" stroke-width="1.2" fill="none"/>
    <path d="M417,134 Q421,132 424,134" stroke="#1e293b" stroke-width="1.2" fill="none"/>
    <path d="M410,150 Q414,156 418,150" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Rosy Blush -->
    <circle cx="402" cy="147" r="3.5" fill="#fda4af" opacity="0.8"/>
    <circle cx="424" cy="147" r="3.5" fill="#fda4af" opacity="0.8"/>

    <!-- Doctor / Pharmacist Coat & Coral-Rose Shirt -->
    <path d="M390,195 L435,195 L448,255 L375,255 Z" fill="#ffffff"/>
    <path d="M380,195 L402,255 L370,255 Z" fill="#ff6b7e"/>
    <path d="M445,195 L425,255 L458,255 Z" fill="#ff6b7e"/>
    <!-- Coral / Stethoscope Collar Accent -->
    <path d="M400,195 L412,225 L424,195" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>

    <!-- Medical Clipboard Held in Hands -->
    <g transform="rotate(-6 400 220)">
      <!-- Board -->
      <rect x="375" y="180" width="36" height="52" rx="4" fill="#2d1b2e"/>
      <!-- Clip -->
      <rect x="386" y="176" width="14" height="7" rx="2" fill="#ffd1dc"/>
      <circle cx="393" cy="179" r="2" fill="#be185d"/>
      <!-- Rx Sheet -->
      <rect x="379" y="186" width="28" height="42" rx="2" fill="#ffffff"/>
      <line x1="384" y1="194" x2="402" y2="194" stroke="#fda4af" stroke-width="2"/>
      <line x1="384" y1="200" x2="400" y2="200" stroke="#fbcfe8" stroke-width="1.5"/>
      <line x1="384" y1="206" x2="398" y2="206" stroke="#fbcfe8" stroke-width="1.5"/>
      <line x1="384" y1="212" x2="402" y2="212" stroke="#fbcfe8" stroke-width="1.5"/>
      <!-- Thumb holding clipboard -->
      <ellipse cx="376" cy="205" rx="4" ry="6" fill="#fed7aa" transform="rotate(20 376 205)"/>
      <ellipse cx="410" cy="215" rx="4" ry="6" fill="#fed7aa"/>
    </g>
  </g>

  <!-- 4. Modern Pharmacy Dispensing Counter in Pink / Coral Gradient -->
  <g id="counter">
    <!-- Counter Top Ledge Surface -->
    <path d="M300,240 L540,240 L540,260 L290,260 Q290,240 300,240 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(225,29,72,0.06))"/>
    <rect x="290" y="240" width="250" height="12" rx="6" fill="#fff5f6"/>

    <!-- Counter Main Body -->
    <path d="M292,252 L540,252 L540,480 L292,480 Z" fill="url(#counterGrad)"/>

    <!-- Organic Fluid Waves on Lower Counter in Coral-Pink to Lilac -->
    <path d="M292,390 C340,360 400,430 460,400 C500,380 520,390 540,380 L540,480 L292,480 Z" fill="url(#waveFluidGrad)" opacity="0.95"/>
    <path d="M330,420 C380,390 430,440 480,420 C510,410 530,415 540,410 L540,480 L330,480 Z" fill="url(#waveFluidDeep)"/>

    <!-- White Medical Cross Emblem (+) on Counter -->
    <g transform="translate(415, 330)">
      <circle cx="0" cy="0" r="28" fill="rgba(255, 255, 255, 0.3)"/>
      <!-- Vertical Bar -->
      <rect x="-6" y="-18" width="12" height="36" rx="5" fill="#ffffff"/>
      <!-- Horizontal Bar -->
      <rect x="-18" y="-6" width="36" height="12" rx="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- 5. Male Customer / Patient (In Front of Counter, Pink Striped Theme) -->
  <g id="customer">
    <!-- Legs & Trousers -->
    <path d="M305,300 L305,480 L345,480 L345,300 Z" fill="#ded7ce"/>
    <line x1="325" y1="340" x2="325" y2="480" stroke="#bfb6aa" stroke-width="2"/>

    <!-- Torso / Striped Coral-Pink T-Shirt (Matching dashboard theme) -->
    <path d="M280,185 C295,180 320,180 345,190 C355,200 358,230 355,305 C335,310 295,310 280,305 C275,270 270,220 280,185 Z" fill="#ff6b7e"/>
    
    <!-- White Horizontal T-Shirt Stripes -->
    <path d="M278,205 C295,202 325,204 349,208 L351,215 C325,211 295,209 277,212 Z" fill="#ffffff"/>
    <path d="M276,225 C295,222 325,224 353,228 L354,235 C325,231 295,229 275,232 Z" fill="#ffffff"/>
    <path d="M275,245 C295,242 325,244 355,248 L355,255 C325,251 295,249 275,252 Z" fill="#ffffff"/>
    <path d="M276,265 C295,262 325,264 355,268 L355,275 C325,271 295,269 276,272 Z" fill="#ffffff"/>
    <path d="M277,285 C295,282 325,284 354,288 L353,295 C325,291 295,289 278,292 Z" fill="#ffffff"/>

    <!-- Left Arm Resting Back in Warm Rose Tone -->
    <path d="M280,195 C270,215 265,245 270,270 L285,270 C280,250 285,225 292,205 Z" fill="#e11d48"/>

    <!-- Right Arm Extended / Gesturing Toward Pharmacist -->
    <path d="M338,195 C355,210 365,235 360,265 L346,265 C348,245 342,225 330,210 Z" fill="#ff6b7e"/>
    <path d="M360,260 C370,260 380,245 378,225 C378,218 368,218 365,230 Z" fill="#fed7aa"/>

    <!-- Neck -->
    <rect x="305" y="165" width="18" height="25" fill="#fed7aa"/>

    <!-- Head & Face Profile -->
    <path d="M300,125 C300,105 325,100 338,115 C345,122 346,145 340,165 C330,175 305,175 300,165 Z" fill="#fed7aa"/>

    <!-- Customer Dark Hair -->
    <path d="M298,135 C295,115 305,95 325,95 C342,95 350,110 348,128 C340,118 330,115 318,120 C310,124 305,130 298,135 Z" fill="url(#hairGrad)"/>
    <path d="M298,135 C296,145 302,152 305,152 C306,145 304,138 298,135 Z" fill="url(#hairGrad)"/>

    <!-- Profile Eye, Ear & Smile -->
    <circle cx="316" cy="144" r="5" fill="#fed7aa"/>
    <path d="M315,142 Q317,144 316,147" stroke="#e11d48" stroke-width="1" fill="none"/>
    <ellipse cx="334" cy="138" rx="2" ry="2.5" fill="#1e293b"/>
    <path d="M330,132 Q334,130 337,132" stroke="#1e293b" stroke-width="1.2" fill="none"/>
    <path d="M334,150 Q338,154 342,148" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 6. Multi-Layer Organic Wave Cut-Out on Left Edge (Rose-tinted outer wave, crisp white inner wave) -->
  <g>
    <!-- Outer Soft Wave Layer in Lightish Rose / Pink -->
    <path d="M0,0 L85,0 C140,50 170,120 120,195 C70,270 105,355 160,410 C195,445 180,480 115,480 L0,480 Z" 
          fill="#fecdd3" opacity="0.55"/>

    <!-- Inner Crisp White Wave Layer (Smooth transition into white login card) -->
    <path d="M0,0 L70,0 C125,50 155,120 105,195 C55,270 90,355 145,410 C180,445 165,480 100,480 L0,480 Z" 
          fill="#ffffff" filter="url(#waveShadow)"/>
  </g>
</svg>
